name = "emmail-southandozarks"
main = "src/worker.ts"
compatibility_date = "2026-06-17"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_BASE_URL = "https://emmail.autojack.ai"
DEFAULT_FROM_EMAIL = "southandozarks@autojack.ai"
DEFAULT_FROM_NAME = "EmMail"
EMMAIL_SEND_MODE = "live"
# Ingest-triggered welcome email. Default off: flip to "true" to arm it (an
# armed welcome still only sends for real when EMMAIL_SEND_MODE = "live").
EMMAIL_WELCOME_ENABLED = "false"

# Dedicated hostname. This is a Workers custom domain, not a path route on
# southandozarks.autojack.ai. workers.dev remains as a fallback.
[[routes]]
pattern = "emmail.autojack.ai"
custom_domain = true

[[d1_databases]]
binding = "DB"
# Temporary fallback: the account is currently at its D1 database limit, so
# EmMail is bound to an existing empty D1. Swap to a dedicated
# emmail-southandozarks database when a D1 slot is available.
database_name = "autojack"
database_id = "3a762ed8-7dd4-4770-9d67-15b8ea1d163a"

[[queues.producers]]
binding = "SEND_QUEUE"
queue = "emmail-southandozarks-send"

[[queues.consumers]]
queue = "emmail-southandozarks-send"
max_batch_size = 10
max_batch_timeout = 30
# Single-flight consumer: batch continuation derives its Resend idempotency
# key from campaigns.last_completed_batch, which assumes no two consumers
# process the same campaign concurrently.
max_concurrency = 1
max_retries = 3

# Wake multi-step automations whose waits exceed the queue delay cap (12h),
# and self-heal enrollments whose immediate queue message was lost.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
